<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Odys Lee  Full-stack engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="45%" stop-color="#0F2138"/>
      <stop offset="100%" stop-color="#132A3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#E8C9A0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4A574" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- atmospheric light -->
  <ellipse cx="980" cy="60" rx="280" ry="160" fill="#1F4A5C" opacity="0.35"/>
  <ellipse cx="180" cy="320" rx="320" ry="140" fill="#0C2A24" opacity="0.4"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="360" fill="url(#accent)"/>

  <!-- geometric motif -->
  <g opacity="0.9" transform="translate(920, 70)">
    <path d="M0 110 L90 0 L180 110 Z" fill="none" stroke="#D4A574" stroke-width="1.5" opacity="0.55"/>
    <path d="M30 110 L90 35 L150 110 Z" fill="none" stroke="#E8C9A0" stroke-width="1.2" opacity="0.4"/>
    <circle cx="90" cy="72" r="6" fill="#D4A574"/>
    <circle cx="90" cy="72" r="18" fill="none" stroke="#D4A574" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="220" stroke="url(#gridFade)" stroke-width="1"/>
  </g>

  <!-- brand -->
  <text x="64" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="6" fill="#D4A574" font-weight="600">ODYS LEE</text>
  <text x="64" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#F4EDE3" font-weight="700">Build systems people trust.</text>
  <text x="64" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9BB0C2">Full-stack engineer · product infrastructure · privacy-aware architecture</text>

  <!-- bottom meta row -->
  <g transform="translate(64, 300)">
    <rect x="0" y="0" width="8" height="8" fill="#D4A574"/>
    <text x="18" y="9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8FA3B5" letter-spacing="1">TypeScript · React · Node · Infra</text>
    <rect x="280" y="0" width="8" height="8" fill="#D4A574" opacity="0.7"/>
    <text x="298" y="9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8FA3B5" letter-spacing="1">Shipped products · funded startups · live tooling</text>
  </g>
</svg>
